# Keep the previous project name so existing database volumes are reused.
name: jago-bahe-backend

services:
  backend:
    build:
      context: ./jago-bahe-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./jago-bahe-backend/.env
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: "host=db port=5432 sslmode=disable"
      PGUSER: ${POSTGRES_USER:-jago}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the backend .env}
      PGDATABASE: ${POSTGRES_DB:-jago}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the backend .env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--timeout=3", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-net

  migrate:
    build:
      context: ./jago-bahe-backend
      dockerfile: Dockerfile
    command: ["./migrate", "up"]
    env_file:
      - ./jago-bahe-backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: "host=db port=5432 sslmode=disable"
      PGUSER: ${POSTGRES_USER:-jago}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the backend .env}
      PGDATABASE: ${POSTGRES_DB:-jago}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the backend .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jago}
      POSTGRES_USER: ${POSTGRES_USER:-jago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the backend .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge
