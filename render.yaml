# Render API using an externally managed PostgreSQL database (for example Neon).
# Set DATABASE_URL in the Render dashboard; never commit it to this file.
services:
  - type: web
    name: jago-bahe-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./jago-bahe-backend/Dockerfile
    dockerContext: ./jago-bahe-backend
    dockerCommand: /bin/sh -c '/app/migrate up && exec /app/api'
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - fromGroup: jago-bahe-settings
      - key: HTTP_ADDR
        value: "0.0.0.0:10000"
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

envVarGroups:
  - name: jago-bahe-settings
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_TTL
        value: 24h
      - key: VALIDITY_THRESHOLD
        value: "5"
      - key: RESPONSE_DEADLINE
        value: 168h
      - key: BLOCKER_REVIEW_WINDOW
        value: 72h
